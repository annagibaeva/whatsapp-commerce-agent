[project]
name = "wca"
version = "0.1.0"
description = "WhatsApp Commerce Agent v0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
wca = "wca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
